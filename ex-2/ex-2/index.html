<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Market | Premium Shopping</title>
    <meta name="description" content="Premium fruit market with a seamless shopping experience, pricing in Rupees, and cart management.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-light: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #10b981;
            --danger: #ef4444;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            background-image: 
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.025em;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            cursor: pointer;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
        }

        .cart-trigger {
            position: relative;
            background: white;
            border: 1px solid var(--border);
            padding: 0.75rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow);
        }

        .cart-trigger:hover {
            border-color: var(--primary);
            transform: scale(1.05);
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--danger);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 20px;
            border: 2px solid white;
            min-width: 20px;
            text-align: center;
        }

        /* Card Grid */
        #card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            position: relative;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: scaleIn 0.5s ease-out;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .card-price {
            font-weight: 700;
            color: var(--accent);
            font-size: 1.25rem;
            margin-bottom: 0.75rem;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            gap: 0.75rem;
            margin-top: auto;
            border-top: 1px solid var(--border);
            padding-top: 1rem;
            justify-content: space-between;
        }

        .btn-add-cart {
            background: #eff6ff;
            color: var(--primary);
            flex-grow: 1;
            justify-content: center;
        }

        .btn-add-cart:hover {
            background: var(--primary);
            color: white;
        }

        .action-group {
            display: flex;
            gap: 0.5rem;
        }

        .btn-icon {
            padding: 0.5rem;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid var(--border);
            color: var(--text-muted);
            transition: all 0.2s;
            cursor: pointer;
        }

        .btn-icon:hover {
            color: var(--primary);
            background: white;
            border-color: var(--primary);
        }

        /* Cart Sidebar */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100vh;
            background: white;
            z-index: 2000;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.1);
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar.active {
            right: 0;
        }

        .cart-header-side {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #f1f5f9;
            align-items: center;
        }

        .cart-item-info {
            flex-grow: 1;
        }

        .cart-item-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .cart-item-price {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 600;
        }

        .cart-quantity {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: #f8fafc;
            padding: 4px 8px;
            border-radius: 8px;
        }

        .qty-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--primary);
            font-weight: 700;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .qty-btn:hover {
            background: white;
        }

        .cart-footer-side {
            padding: 1.5rem;
            border-top: 1px solid var(--border);
            background: #f8fafc;
        }

        .cart-total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .cart-grand-total {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-main);
            border-top: 1px dashed var(--border);
            padding-top: 1rem;
            margin-top: 1rem;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1500;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: white;
            padding: 2.5rem;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            border: 1px solid var(--border);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input, textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            grid-column: 1 / -1;
            color: var(--text-muted);
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .removing {
            animation: scaleOut 0.3s forwards;
        }

        @keyframes scaleOut {
            to { opacity: 0; transform: scale(0.9); }
        }

        @media (max-width: 640px) {
            body { padding: 1rem; }
            header { flex-direction: column; gap: 1rem; align-items: center; text-align: center; }
            h1 { font-size: 2rem; }
            #card-grid { grid-template-columns: 1fr; }
            .cart-sidebar { width: 100%; right: -100%; }
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay"></div>

    <div class="container">
        <header>
            <div>
                <h1>Fresh Market</h1>
                <p style="color: var(--text-muted)">Premium orchard-fresh products</p>
            </div>
            <div class="header-actions">
                <button id="add-btn" class="btn btn-primary" title="Add New Product">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add Product
                </button>
                <div class="cart-trigger" id="cart-btn" title="View Cart">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                    <span class="cart-count" id="cart-count">0</span>
                </div>
            </div>
        </header>

        <main id="card-grid">
            <!-- Products will be injected here -->
        </main>
    </div>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header-side">
            <h2 style="font-weight: 700">Shopping Cart</h2>
            <button class="btn-icon" id="close-cart">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="cart-items" id="cart-items-container">
            <!-- Cart items will be injected here -->
        </div>
        <div class="cart-footer-side">
            <div class="cart-total-row">
                <span>Total Items</span>
                <span id="cart-total-qty">0</span>
            </div>
            <div class="cart-grand-total">
                <span>Total Amount</span>
                <span id="cart-grand-total">₹0.00</span>
            </div>
            <button class="btn btn-primary" style="width: 100%; justify-content: center">Proceed to Checkout</button>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-bottom: 1.5rem">New Product</h2>
            <form id="card-form">
                <input type="hidden" id="card-id">
                <div class="form-group">
                    <label for="title">Product Name</label>
                    <input type="text" id="title" placeholder="e.g. Red Apple" required>
                </div>
                <div class="form-group">
                    <label for="price">Price (₹)</label>
                    <input type="number" id="price" step="0.01" min="0" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" rows="3" placeholder="Describe the product..." required></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancel-btn" class="btn" style="background: transparent; color: var(--text-muted)">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Default Data (Updated to Rupees)
        const defaultProducts = [
            { id: "1", title: "Apple", price: 180, description: "Crisp, sweet red apples freshly picked from the orchard.", createdAt: new Date().toISOString() },
            { id: "2", title: "Orange", price: 80, description: "Juicy citrus oranges rich in Vitamin C and natural flavor.", createdAt: new Date().toISOString() },
            { id: "3", title: "Banana", price: 60, description: "Perfectly ripe yellow bananas, a great energy boost.", createdAt: new Date().toISOString() },
            { id: "4", title: "Mango", price: 250, description: "Sweet tropical mangoes with a rich, smooth texture.", createdAt: new Date().toISOString() },
            { id: "5", title: "Pineapple", price: 120, description: "Zesty and refreshing tropical pineapple slices.", createdAt: new Date().toISOString() },
            { id: "6", title: "Strawberry", price: 300, description: "Bright red strawberries, perfect for desserts and snacks.", createdAt: new Date().toISOString() },
            { id: "7", title: "Blueberry", price: 450, description: "Hand-picked blueberries packed with antioxidants.", createdAt: new Date().toISOString() },
            { id: "8", title: "Watermelon", price: 100, description: "Cool and hydrating watermelon, the ultimate summer fruit.", createdAt: new Date().toISOString() },
            { id: "9", title: "Kiwi", price: 150, description: "Tangy green kiwi fruit with a unique tropical taste.", createdAt: new Date().toISOString() },
            { id: "10", title: "Grapes", price: 140, description: "Sweet seedless grapes, crisp and delicious.", createdAt: new Date().toISOString() }
        ];

        // State Management
        let products = JSON.parse(localStorage.getItem('cards'));
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        
        // Data cleaning and initialization
        function cleanData() {
            let needsUpdate = false;
            
            // Fix products
            if (products) {
                products = products.map(p => {
                    if (isNaN(parseFloat(p.price))) {
                        p.price = Math.floor(Math.random() * 451) + 50;
                        needsUpdate = true;
                    }
                    return p;
                });
            }

            // Fix cart
            cart = cart.map(item => {
                if (isNaN(parseFloat(item.price))) {
                    item.price = Math.floor(Math.random() * 451) + 50;
                    needsUpdate = true;
                }
                return item;
            });

            if (needsUpdate) {
                localStorage.setItem('cards', JSON.stringify(products));
                localStorage.setItem('cart', JSON.stringify(cart));
            }
        }

        if (!products || products.length === 0 || (products[0] && products[0].price < 10)) {
            products = defaultProducts;
            localStorage.setItem('cards', JSON.stringify(products));
        } else {
            cleanData();
        }

        let isEditing = false;

        // DOM Elements
        const cardGrid = document.getElementById('card-grid');
        const modal = document.getElementById('modal');
        const cardForm = document.getElementById('card-form');
        const addBtn = document.getElementById('add-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const cartBtn = document.getElementById('cart-btn');
        const cartSidebar = document.getElementById('cart-sidebar');
        const closeCart = document.getElementById('close-cart');
        const overlay = document.getElementById('overlay');
        const cartItemsContainer = document.getElementById('cart-items-container');
        const cartCount = document.getElementById('cart-count');
        const cartTotalQty = document.getElementById('cart-total-qty');
        const cartGrandTotal = document.getElementById('cart-grand-total');

        // Render Products
        function renderProducts() {
            if (products.length === 0) {
                cardGrid.innerHTML = `
                    <div class="empty-state">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1rem; opacity: 0.3"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                        <h3>Inventory Empty</h3>
                        <p>Start by adding some fresh products</p>
                    </div>
                `;
                return;
            }

            cardGrid.innerHTML = products.map(product => `
                <div class="card" id="product-${product.id}">
                    <div class="card-header">
                        <h3 class="card-title">${escapeHTML(product.title)}</h3>
                    </div>
                    <div class="card-price">₹${Number(product.price).toFixed(2)}</div>
                    <p class="card-desc">${escapeHTML(product.description)}</p>
                    <div class="card-footer">
                        <button class="btn btn-add-cart" onclick="addToCart('${product.id}')">
                            Add to Cart
                        </button>
                        <div class="action-group">
                            <button class="btn-icon" onclick="editProduct('${product.id}')" title="Edit">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                            </button>
                            <button class="btn-icon btn-delete" onclick="deleteProduct('${product.id}')" title="Delete">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Render Cart
        function renderCart() {
            const totalItems = cart.reduce((acc, item) => acc + item.quantity, 0);
            const totalPrice = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
            
            cartCount.textContent = totalItems;
            cartTotalQty.textContent = totalItems;
            cartGrandTotal.textContent = `₹${totalPrice.toFixed(2)}`;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `
                    <div style="text-align: center; margin-top: 4rem; color: var(--text-muted)">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.5; margin-bottom: 1rem"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                        <p>Your cart is empty</p>
                    </div>
                `;
                return;
            }

            cartItemsContainer.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <div class="cart-item-title">${escapeHTML(item.title)}</div>
                        <div class="cart-item-price">₹${Number(item.price).toFixed(2)} / unit</div>
                    </div>
                    <div class="cart-quantity">
                        <button class="qty-btn" onclick="updateQty('${item.id}', -1)">−</button>
                        <span style="font-weight: 600; min-width: 20px; text-align: center">${item.quantity}</span>
                        <button class="qty-btn" onclick="updateQty('${item.id}', 1)">+</button>
                    </div>
                </div>
            `).join('');
        }

        // State Helpers
        function saveProducts() {
            localStorage.setItem('cards', JSON.stringify(products));
            renderProducts();
        }

        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        // Actions
        window.addToCart = (id) => {
            const product = products.find(p => p.id === id);
            const existingItem = cart.find(item => item.id === id);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            saveCart();
            openCart();
        };

        window.updateQty = (id, delta) => {
            const item = cart.find(i => i.id === id);
            if (!item) return;

            item.quantity += delta;
            if (item.quantity <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            saveCart();
        };

        window.editProduct = (id) => openModal(id);

        window.deleteProduct = (id) => {
            const el = document.getElementById(`product-${id}`);
            el.classList.add('removing');
            setTimeout(() => {
                products = products.filter(p => p.id !== id);
                saveProducts();
                if (cart.find(item => item.id === id)) {
                    cart = cart.filter(item => item.id !== id);
                    saveCart();
                }
            }, 300);
        };

        // UI Controls
        function openCart() {
            cartSidebar.classList.add('active');
            overlay.classList.add('active');
        }

        function toggleCart() {
            cartSidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function openModal(editId = null) {
            modal.classList.add('active');
            if (editId) {
                isEditing = true;
                const product = products.find(p => p.id === editId);
                document.getElementById('card-id').value = product.id;
                document.getElementById('title').value = product.title;
                document.getElementById('price').value = product.price;
                document.getElementById('description').value = product.description;
                document.getElementById('modal-title').textContent = 'Edit Product';
            } else {
                isEditing = false;
                cardForm.reset();
                document.getElementById('card-id').value = '';
                document.getElementById('modal-title').textContent = 'New Product';
            }
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        // Helper
        function escapeHTML(str) {
            const p = document.createElement('p');
            p.textContent = str;
            return p.innerHTML;
        }

        // Event Listeners
        addBtn.addEventListener('click', () => openModal());
        cancelBtn.addEventListener('click', closeModal);
        cartBtn.addEventListener('click', toggleCart);
        closeCart.addEventListener('click', toggleCart);
        overlay.addEventListener('click', toggleCart);

        cardForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('card-id').value;
            const title = document.getElementById('title').value;
            const rawPrice = parseFloat(document.getElementById('price').value);
            // Default to random number (50-500) if price is NaN
            const price = isNaN(rawPrice) ? (Math.floor(Math.random() * 451) + 50) : rawPrice;
            const description = document.getElementById('description').value;

            if (isEditing) {
                products = products.map(p => p.id === id ? { ...p, title, price, description } : p);
                cart = cart.map(item => item.id === id ? { ...item, title, price, description } : item);
            } else {
                products.push({
                    id: Date.now().toString(),
                    title,
                    price,
                    description,
                    createdAt: new Date().toISOString()
                });
            }

            saveProducts();
            saveCart();
            closeModal();
        });

        // Initial Render
        renderProducts();
        renderCart();
    </script>
</body>
</html>
